<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Annunciata AR</title>

  <script src="https://cdn.jsdelivr.net/npm/three@0.152.2/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js"></script>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    #ar-container {
      width: 100%;
      height: 100%;
      position: relative;
    }
  </style>
</head>

<body>

<div id="ar-container"></div>

<script type="module">

import { GLTFLoader } from
"https://cdn.jsdelivr.net/npm/three@0.152.2/examples/jsm/loaders/GLTFLoader.js";

const THREE = window.THREE;

const { MindARThree } = window.MINDAR.IMAGE;

const mindarThree = new MindARThree({
  container: document.querySelector("#ar-container"),
  imageTargetSrc: "./targets.mind"
});

const { renderer, scene, camera } = mindarThree;

const anchor = mindarThree.addAnchor(0);

const loader = new GLTFLoader();

loader.load(
  "./annunciata.glb",
  (gltf) => {

    const model = gltf.scene;

    model.scale.set(0.5, 0.5, 0.5);

    model.position.set(0, 0, 0.1);

    anchor.group.add(model);
  }
);

const light = new THREE.HemisphereLight(
  0xffffff,
  0xbbbbff,
  2
);

scene.add(light);

const start = async () => {

  await mindarThree.start();

  renderer.setAnimationLoop(() => {

    renderer.render(scene, camera);

  });

};

start();

</script>

</body>
</html>
